name: Deploy schedule MCP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-schedule-mcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package MCP server
        run: zip -r mcp-server.zip mcp_server -x '*/__pycache__/*' 'mcp_server/data/*'

      - name: Upload MCP server archive
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "mcp-server.zip"
          target: "/tmp/schedule-deploy/"

      - name: Install and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -eu

            APP_DIR="$HOME/schedule"
            STAGING_DIR="/tmp/schedule-deploy"
            ARCHIVE="$STAGING_DIR/mcp-server.zip"
            EXTRACT_DIR="$STAGING_DIR/extracted"
            SERVICE_NAME="schedule-mcp.service"

            cleanup() {
              rm -rf "$STAGING_DIR"
            }
            trap cleanup EXIT

            healthy() {
              sleep 5
              systemctl is-active --quiet "$SERVICE_NAME"
            }

            test -f "$ARCHIVE"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"
            test -f "$EXTRACT_DIR/mcp_server/run.py"

            # Данные не копируем — они лежат в DATA_DIR и переживают деплой.
            mkdir -p "$DATA_DIR"
            mkdir -p "$APP_DIR"

            # Заменяем приложение целиком: старую версию удаляем.
            rm -rf "$APP_DIR/mcp_server"
            cp -a "$EXTRACT_DIR/mcp_server" "$APP_DIR/mcp_server"
            chmod -R u+rwX "$APP_DIR/mcp_server"

            if [ ! -x "$APP_DIR/venv/bin/python" ]; then
              python3 -m venv "$APP_DIR/venv"
            fi
            "$APP_DIR/venv/bin/python" -m pip install -r "$APP_DIR/mcp_server/requirements.txt"

            # либо приложение читает SCHEDULE_DATA_DIR из окружения.
            sudo systemctl restart "$SERVICE_NAME" || true

            if ! healthy; then
              echo "Service failed to start after deploy. Rollback is disabled by design." >&2
              sudo systemctl status "$SERVICE_NAME" --no-pager || true
              sudo journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true
              exit 1
            fi

            echo "MCP server deployed successfully"